version: "3"
services:
  mysql:
    image: mysql:5.7.28
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: totallyunsafe
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptotallyunsafe"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - ./infrastructure/sql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "2000:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: totallyunsafe
  apache:
    build: ./docker/apache
    container_name: apache
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./source:/var/www/html/
    ports:
      - "8080:80"
  tavern:
    build: ./docker/tavern
    container_name: tavern
    volumes:
      - ./apitests:/apitests
